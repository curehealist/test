<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테트리스 2인용</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">

    <!-- P1 사이드패널 (왼쪽) -->
    <div class="side-panel side-panel--left">
      <h2 class="player-title p1-color">P1</h2>

      <div class="info-box">
        <div class="label">다음 블록</div>
        <canvas id="next1" width="100" height="100"></canvas>
      </div>

      <div class="info-box">
        <div class="label">점수</div>
        <div class="value" id="score1">0</div>
      </div>

      <div class="info-box">
        <div class="label">레벨</div>
        <div class="value" id="level1">1</div>
      </div>

      <div class="info-box">
        <div class="label">라인</div>
        <div class="value" id="lines1">0</div>
      </div>

      <div class="controls">
        <button id="startBtn1" class="btn btn-start">시작</button>
      </div>

      <div class="key-guide">
        <div class="guide-title">P1 조작법</div>
        <div class="guide-item"><span class="key">A / D</span> 이동</div>
        <div class="guide-item"><span class="key">W</span> 회전</div>
        <div class="guide-item"><span class="key">S</span> 빠르게</div>
        <div class="guide-item"><span class="key">Q</span> 즉시 낙하</div>
        <div class="guide-item"><span class="key">P</span> 일시정지</div>
      </div>
    </div>

    <!-- P1 보드 -->
    <div class="game-container">
      <canvas id="board1" width="300" height="600"></canvas>
      <div id="overlay1" class="board-overlay hidden">
        <div class="board-overlay-content">
          <div id="overlayTitle1" class="board-overlay-title">P1</div>
          <div id="overlayMessage1" class="board-overlay-message">시작 버튼을 누르세요</div>
          <div id="overlayScore1" class="board-overlay-score"></div>
          <button id="overlayStartBtn1" class="btn btn-start overlay-btn">시작</button>
        </div>
      </div>
    </div>

    <!-- 중앙 구분선 -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-title">VS</div>
      <div class="divider-line"></div>
      <button id="pauseBtn" class="btn btn-pause" disabled>일시정지</button>
    </div>

    <!-- P2 보드 -->
    <div class="game-container">
      <canvas id="board2" width="300" height="600"></canvas>
      <div id="overlay2" class="board-overlay hidden">
        <div class="board-overlay-content">
          <div id="overlayTitle2" class="board-overlay-title">P2</div>
          <div id="overlayMessage2" class="board-overlay-message">시작 버튼을 누르세요</div>
          <div id="overlayScore2" class="board-overlay-score"></div>
          <button id="overlayStartBtn2" class="btn btn-start overlay-btn">시작</button>
        </div>
      </div>
    </div>

    <!-- P2 사이드패널 (오른쪽) -->
    <div class="side-panel side-panel--right">
      <h2 class="player-title p2-color">P2</h2>

      <div class="info-box">
        <div class="label">다음 블록</div>
        <canvas id="next2" width="100" height="100"></canvas>
      </div>

      <div class="info-box">
        <div class="label">점수</div>
        <div class="value" id="score2">0</div>
      </div>

      <div class="info-box">
        <div class="label">레벨</div>
        <div class="value" id="level2">1</div>
      </div>

      <div class="info-box">
        <div class="label">라인</div>
        <div class="value" id="lines2">0</div>
      </div>

      <div class="controls">
        <button id="startBtn2" class="btn btn-start">시작</button>
      </div>

      <div class="key-guide">
        <div class="guide-title">P2 조작법</div>
        <div class="guide-item"><span class="key">← / →</span> 이동</div>
        <div class="guide-item"><span class="key">↑</span> 회전</div>
        <div class="guide-item"><span class="key">↓</span> 빠르게</div>
        <div class="guide-item"><span class="key">Space</span> 즉시 낙하</div>
        <div class="guide-item"><span class="key">P</span> 일시정지</div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
